# Default: the Angular dev server.
# Mark-book database: docker compose --profile markbook up
services:
  web:
    build: .
    ports:
      - '${WEB_PORT:-4200}:4200'
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    environment:
      NODE_ENV: development

  db:
    image: postgres:16-alpine
    profiles: ['markbook']
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-exam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-exam}
      POSTGRES_DB: ${POSTGRES_DB:-exam_validator}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - markbook_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro

volumes:
  web_node_modules:
  markbook_data:
