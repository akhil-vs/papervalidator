# Default: the Angular dev server.
# Mark-book database and API: docker compose --profile markbook up
services:
  web:
    build: .
    ports:
      - '${WEB_PORT:-4200}:4200'
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    environment:
      NODE_ENV: development

  db:
    image: postgres:16-alpine
    profiles: ['markbook']
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-exam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-exam}
      POSTGRES_DB: ${POSTGRES_DB:-exam_validator}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - markbook_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-exam} -d ${POSTGRES_DB:-exam_validator}']
      interval: 2s
      timeout: 5s
      retries: 20

  api:
    profiles: ['markbook']
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - '${API_PORT:-8080}:8080'
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-exam}:${POSTGRES_PASSWORD:-exam}@db:5432/${POSTGRES_DB:-exam_validator}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      PORT: '8080'
    depends_on:
      db:
        condition: service_healthy

volumes:
  web_node_modules:
  markbook_data:
